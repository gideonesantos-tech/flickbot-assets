name: FlickBot Aniversarios 06h30

on:
  schedule:
    # Roda todos os dias às 09:30 UTC (que equivale a 06:30 no horário de Brasília/SP)
    - cron: '30 9 * * *'
  workflow_dispatch: # Mantém o botão manual para testes

jobs:
  avisar_teams:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests tzdata

      - name: Executar FlickBot
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python flickbot_aniversario.py
